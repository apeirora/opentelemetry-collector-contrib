# Certificate log verify processor — file-based HMAC key (minimal config).
# mode, failure_mode, and verification_profile use their defaults
# (sync, strict, default).
certificatelogverify:
  hmac_key_file: /etc/otelcol/hmac.key

# Asymmetric certificate verification with mark failure mode.
certificatelogverify/cert_mark:
  mode: sync
  failure_mode: mark
  verification_profile: default
  cert_file: /etc/otelcol/cert.pem

# Combined HMAC + certificate verification.
certificatelogverify/hmac_and_cert:
  hmac_key_file: /etc/otelcol/hmac.key
  cert_file: /etc/otelcol/cert.pem

# Kubernetes Secret key material.
certificatelogverify/k8s:
  k8s_secret:
    name: verify-secret
    namespace: default
    hmac_key_entry: hmac.key
    cert_key: tls.crt

# Hash-chain continuity enabled (requires a storage extension).
certificatelogverify/hash_chain:
  hmac_key_file: /etc/otelcol/hmac.key
  hash_chain:
    enabled: true
    storage: file_storage

# Dead-letter queue for verification failures.
certificatelogverify/dead_letter:
  failure_mode: mark
  hmac_key_file: /etc/otelcol/hmac.key
  dead_letter:
    enabled: true
    storage: file_storage
    key_prefix: audit_verify_dlq/
    reasons:
      - integrity_mismatch
      - missing_integrity_value
    partition_by_stream: true
    fail_on_storage_error: true
